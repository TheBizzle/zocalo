<html>

  <head>
    <meta charset="utf-8"/>
    <link href="/html/common/main.css" rel="stylesheet">
    <link href="register.css" rel="stylesheet">
  </head>

  <body>

    <div>
      Hi.  Please register for an account.  No password is needed.  We will email you a one-time password whenever you want to log in.
    </div>

    <form id="main-form">
      <div>
        <label for="email">Email: </label>
        <input type="email" name="email" id="email" required />
      </div>
      <div>
        <input type="submit" value="Register" />
      </div>
    </form>

  </body>

  <script src="/html/common/register.js"></script>

</html>
