<html>

  <head>
    <meta charset="utf-8"/>
    <link href="/html/common/main.css" rel="stylesheet">
    <link href="input-otp.css" rel="stylesheet">
  </head>

  <body>

    <div>
      Check your e-mail!<br>
      A one-time passcode was just sent to <span id="email-address"></span><br>
      It might take a few minutes for you to receive the email.  Remember to check your "Spam" folder if you don't find it promptly.
    </div>

    <form id="main-form">
      <div>
        <label for="passcode">Passcode: </label>
        <input type="text" name="passcode" id="passcode" required />
      </div>
      <div>
        <input type="submit" value="Log In" />
      </div>
    </form>

  </body>

  <script src="/html/common/input-otp.js"></script>

</html>
