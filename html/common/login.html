<html>

  <head>
    <meta charset="utf-8"/>
    <link href="/html/common/main.css" rel="stylesheet">
    <link href="login.css" rel="stylesheet">
  </head>

  <body>

    <div id="not-logged-in-pane" class="hidden">

      <div>
        Supply your e-mail address and press "Login" to receive a one-time passcode.<br>
        Don't have an account?  Register <a href="/auth/register">here</a>.
      </div>

      <form id="main-form">
        <div>
          <label for="email">Email: </label>
          <input type="email" name="email" id="email" required />
        </div>
        <div>
          <input type="submit" value="Get Passcode" />
        </div>
      </form>

    </div>

    <div id="logged-in-pane" class="hidden">
      <input id="logout-button" type="button" value="Log Out" />
    </div>

  </body>

  <script src="/html/common/login.js"></script>

</html>
