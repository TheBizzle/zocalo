name:        zocalo
version:     1.1
category:    Web
stability:   Experimental
build-type:  Simple

language: GHC2024

default-extensions:
  - OverloadedRecordDot
  - OverloadedStrings

dependencies:
  - bizzlelude >= 4.20.2.0.3 && < 4.21.0

ghc-options:
  - -Wall
  - -Wcompat
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-import-lists
  - -Wredundant-constraints
  - -fno-warn-name-shadowing
  - -funbox-strict-fields
  - -threaded
  - -O2

executables:
  zocalo:
    source-dirs: app
    main:        Main.hs
    dependencies:
      - snap-core
      - snap-server >= 1.1.2 && < 1.2.0
      - zocalo

library:
  source-dirs: src/main
  dependencies:
    - aeson                 >= 2.2.5  && < 2.3
    - base64-bytestring     >= 1.2.1  && < 1.3
    - bifunctors            >= 5.6.3  && < 5.7
    - bytestring            >= 0.12.2 && < 0.13
    - case-insensitive      >= 1.2.1  && < 1.3
    - containers            >= 0.7    && < 0.8
    - crypton               >= 1.0.6  && < 1.1
    - directory             >= 1.3.8  && < 1.4
    - file-embed            >= 0.0.16 && < 0.1
    - http-conduit          >= 2.3.9  && < 2.4
    - io-streams            >= 1.5.2  && < 1.6
    - jose                  >= 0.11   && < 0.12
    - lens                  >= 5.3.6  && < 5.4
    - memory                >= 0.18.0 && < 0.19
    - monad-logger          >= 0.3.42 && < 0.4
    - mwc-random            >= 0.15.3 && < 0.16
    - NanoID                >= 3.4.1  && < 3.5
    - pcre-heavy            >= 1.0.0  && < 1.1
    - persistent            >= 2.17.1 && < 2.18
    - persistent-postgresql >= 2.13.7 && < 2.14
    - persistent-template   >= 2.12.0 && < 2.13
    - random                >= 1.2.1  && < 1.3
    - resourcet             >= 1.3.0  && < 1.4
    - snap-core             >= 1.0.5  && < 1.1
    - template-haskell      >= 2.22.0 && < 2.23
    - text                  >= 2.1.3  && < 2.2
    - time                  >= 1.12.2 && < 1.13
    - transformers          >= 0.6.1  && < 0.7
    - uuid                  >= 1.3.16 && < 1.4
    - validation            >= 1.1.5  && < 1.2
    - zlib                  >= 0.7.1  && < 0.8

tests:
  tests:
    main:        Main.hs
    source-dirs: src/test
    dependencies:
      - HUnit                >= 1.6.2 && < 1.7.0
      - test-framework       >= 0.8
      - test-framework-hunit >= 0.3
